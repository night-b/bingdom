<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="cart.css">
</head>
<body>
      <section class="header">
        <div class="logo">
            <!-- <img src="imabges/ChatGPT Image Aug 20, 2026, 07_27_27 AM.png" alt="Logo"> -->
        </div>
        <nav>
            <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="#">Cart</a></li>
            <li><a href="#">Services</a></li>
        </ul>
        </nav>
       </section>
    <section class="cart-section">
    <h2>Shopping Cart</h2>

    <div class="cart-item">
        <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=300" alt="Product">

        <div class="cart-details">
            <h3>Running Sneakers</h3>
            <p class="price">₦25,000</p>

            <div class="quantity">
                <button>-</button>
                <span>1</span>
                <button>+</button>
            </div>
        </div>

        <div class="cart-total">
            <p>₦25,000</p>
            <button class="remove-btn">Remove</button>
        </div>
    </div>

    <div class="cart-item">
        <img src="https://images.unsplash.com/photo-1546868871-7041f2a55e12?w=300" alt="Product">

        <div class="cart-details">
            <h3>Smart Watch</h3>
            <p class="price">₦45,000</p>

            <div class="quantity">
                <button>-</button>
                <span>1</span>
                <button>+</button>
            </div>
        </div>

        <div class="cart-total">
            <p>₦45,000</p>
            <button class="remove-btn">Remove</button>
        </div>
    </div>

    <div class="cart-summary">
        <h3>Order Summary</h3>
        <p>Subtotal: <strong>₦70,000</strong></p>
        <button class="checkout-btn">Proceed to Checkout</button>
    </div>
</section>
</body>
</html>
