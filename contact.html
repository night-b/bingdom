<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <section class="contact" id="contact">
        <form action="">
            <div class="details">
               <label for="name">Name:</label>
               <input type="text" placeholder="Joe Bide">
            </div>
            
            <div class="details">
                <label for="phone">Phone:</label>
                <input type="number">
            </div>

          <div class="details">
            <label for="email">Email:</label>
            <input type="email" name="email" id="email" placeholder="mary@gmail.com">
          </div>

          <div class="details">
            <label for="password">Password:</label>
            <input type="password" name="password" id="password">
          </div>

          <div>
            <h3>What is your favorite colour</h3>
            <input type="radio" name="colour" id="">Blue
            <input type="radio" name="pink" id=""> Pink
            <input type="radio" name="red" id=""> Red
            <input type="radio" name="Green" id=""> Green
          </div>

          <div class="details">
            <input type="checkbox" > Peperonni
            <input type="checkbox" > Cheese
            <input type="checkbox" > Macaroni
          </div>

          <div class="details">
            <h3>Choose your favorite car</h3>
            <select name="" id="">
                <option value="Audi"> Audi</option>
                <option value="Volvo"> Volvo</option>
                <option value="Mercedes"> Mercedes</option>
            </select>
          </div>
        
            <button type="submit" class="btn"> Submit</button>
            <button type="reset" class="btn"> Reset</button>
        </form>
    </section>
</body>
</html>
